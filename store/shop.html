//Initialize the store
function initialize() {

	if (initialized) return;
	initialized = true;

	// Let's just adjust the left-edge offset in case someone
	// decides to make it a bit too small for the buy me buttons

	if (bodyoffset.indexOf('%') > -1){
    		for (var z=0; z<bodyoffset.length; z++){
        		if (bodyoffset.charAt(z) != '%'){
            		formattedoffset += bodyoffset.charAt(z);
			}
    		}
	}
	else { formattedoffset = parseInt(bodyoffset); }
	if (formattedoffset < 10){
    		offset = '10%';
	}
	else {
    		offset = bodyoffset;
	}


	for (var r=0; r<category.length; r++){
    		document.writeln(category[r].name);
    		if (r != category.length-1){
        		document.writeln(' | ');
    		}
	}

	for (var j=1; j<category.length; j++){    
    		for (var c=0; c<category.length; c++){    
        		catCat1 = category[c].cat;
        		catName1 = category[c].name;
        		catCat2 = category[j].cat;
        		catName2 = category[j].name;
        		catName1.length < catName2.length ? shorterLength = catName1.length : shorterLength = catName2.length;
        		for (var p=0; p<shorterLength; p++){
            		if (catName1.charAt(p).toLowerCase() != catName2.charAt(p).toLowerCase()){
                			if (characters.indexOf(catName1.charAt(p).toLowerCase())<characters.indexOf(catName2.charAt(p).toLowerCase())){
                    			category[c].cat = catCat1; category[c].name = catName1;
                    			category[j].cat = catCat2; category[j].name = catName2;
                    			break;
                			}
                			else {
                    			category[c].cat = catCat2; category[c].name = catName2; 
                    			category[j].cat = catCat1; category[j].name = catName1;
                   			break;
                			}
            		}
            		else if (catName1.charAt(p).toLowerCase() == catName2.charAt(p).toLowerCase() && p == shorterLength-1){
                			if (catName1.length == shorterLength){
                    			category[c].cat = catCat1; category[c].name = catName1;
                    			category[j].cat = catCat2; category[j].name = catName2;
                			}
                			else {
                    			category[c].cat = catCat2; category[c].name = catName2;
                    			category[j].cat = catCat1; category[j].name = catName1;
                			}
                			break;
            		}
        		}
    		}
	}
}

function categories(cat,name){

}

// (categories, descriptions, product numbers, price, weight, featured item, distributors/drop ship vendors, additional fields (colors or sizes...), selected additional fields,info page,sales blurb,image)  
function products(cat,productName,versionNum,desc,prodNum,pri,weight,featuredItem,vendor,moreInfo,selectedInfo,page,salespitch,image,url,usrname,passwd){

}



// MORE FIELD INFORMATION - IF STATEMENT FOR EACH SET OF ADD-ONS
function theInfo(what){
    for(var q=0; q<extraArray.length; q++){
        if (what.indexOf(extraArray[q]) > -1){
            this [extraArray[q]]=allExtraArrays[q];
        }
    }
}

function shippingTypes(limit,value){
    this.limit = limit;
    this.value = value;
}


function shippingInformation(text,id){
    this.value = shipValue(id);
    this.text = text;
    this.id = id;
    this.max = eval(id + '.max');
}



function doShip(which){
    for(var p=0; p<shippingInfo.length; p++){
        shippingInfo[p].value = shipValue(shippingInfo[p].id);
        shipping[0] = shippingInfo[which].value;
    }
}

function shipValue(id){
    var q = 0;
    var shippingCharge = eval(id + '.max');
    for(var i=0; i<productList.length; i++){
        if (howToShip == 'quantity'){
            productList[i].quantity > 0 ? q += productList[i].quantity : ''; }
        else if (howToShip == 'weight'){
            productList[i].quantity > 0 ? q += (productList[i].weight*productList[i].quantity) : ''; }
        else {
            productList[i].quantity > 0 ? q += productList[i].quantity * productList[i].pri : ''; }
    }
    for(var p=0; p<eval(id + '.length'); p++){
        if (q <= eval(id + '[p].limit')){
            shippingCharge = eval(id + '[p].value');
            break;
        }
    }
    return shippingCharge;
}
