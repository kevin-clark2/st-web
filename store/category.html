<script language="JavaScript"><!--
// START OFF OUTER TABLE

if (shop.productList != void(0)) {
document.write('<form name="showProducts"><table border="2" width="100%">' +
               '<tr>');



    if (shop.showCategory != ' '){

    

// GO THROUGH EACH PRODUCT LOOKING FOR PRODUCTS WITH THE PROPER CATEGORY

        for (var i=0;i<shop.productList.length;i++){
            if (shop.productList[i].cat == shop.showCategory){


// START AUTO GENERATE

// CELL 1 - BUY ME BUTTON <<------ START CELL !

                document.writeln('<table border="0" width="100%">' +
					   '<td align="left" valign="top" width="100">' + 
                                 '<img src="' + escape(shop.productList[i].image) + '"></td>' +
					   '<td valign="top" align="left" width="' + shop.offset + '">' +
                                 '<a href="javascript:choose(\'' + shop.productList[i].prodNum + '\',');

// CODE TO CHECK FOR EXTRA INFO

                if (shop.productList[i].moreInfo != ''){
                    var plus='no';
                    for(var q=0; q<shop.extraArray.length; q++){
                        if (shop.productList[i].moreInfo.indexOf(shop.extraArray[q]) > -1){
                           if (plus != 'no'){
                                document.writeln('+' + '');
                            }
                            document.writeln('\'' + shop.extraArray[q] + ' (\'' + 
                                             '+ document.showProducts.' + shop.extraArray[q] +
                                             '_' + shop.productList[i].prodNum +
                                             '.options [document.showProducts.' + 
                                             shop.extraArray[q] + '_' + 
                                             shop.productList[i].prodNum +
                                             '.selectedIndex].value + \')\'');
                            plus='yep';
                        }
                    }
                    document.writeln(' + \'~\')">');
                }
                else {
                    document.writeln('\'\')">');
                }                 
                document.writeln('<img src="images/buy.gif" border="0"></a><p align="left">' +

			'<font face="Arial" size="-1"><B>' + 
                                 shop.currency + shop.productList[i].pri + '</B></font></p>' +
// CELL 2 - DESCRIPTION

                                 '</td><td valign="top" align="left">' +
					   '<font face="Arial" size="-1">' +
                                 shop.productList[i].desc + '</font>');

// LINK TO MORE INFO IF THERE IS A PAGE

                if (shop.productList[i].page != ''){
                    document.writeln(' - <font size="1" face="Arial"><a href="');
                    if (shop.productList[i].page == 'x'){
                        document.writeln(shop.productList[i].prodNum + '.html');
                    }
                    else {
                        document.writeln(shop.productList[i].page);
                    }
                    document.writeln('">More Info</a></font>');
                 }
    

// CHECK IF THERE ARE ANY EXTRA INFO ARRAYS

                if (shop.productList[i].moreInfo != ''){
                    document.writeln('<br>');
                    info=shop.productList[i].theInfo;
                    for(var q=0; q<shop.extraArray.length; q++){
                        if (shop.productList[i].moreInfo.indexOf(shop.extraArray[q]) > -1){
                            writeBox(shop.extraArray[q],i);
                        }
                    }
                }

// <--END OF LOOKING FOR ADDITIONAL STUFF

// FINISH OFF THE TABLE ROW

                document.writeln('</td></tr></table><p>');


// END AUTO GENERATE
    
            }
        }
    }

// <--END OF LOOP THROUGH PRODUCTS 





// FINISH OFF OUTER TABLE
document.write('</td></tr></table>');

}

// WRITING THE SELECT BOXES FOR THE EXTRA INFO

function writeBox(what,i){

    var whatone='';

    for (var w=0; w<what.length; w++){



        if (what.charAt(w)=='_'){

            whatone += ' ';

        }

        else {

            whatone += what.charAt(w);

        }

    }

    document.writeln(whatone + ': <select name="' + what + '_' + shop.productList[i].prodNum +

                     '" size="1">');

                     for (var q=0; q<info [what].length; q++){

                         document.writeln('<option value="' + info [what][q] +

                                          '">' + info [what][q] + '</option>');

                     }

                     document.writeln('</select>');

}



// IF THERE IS ANY MORE EXTRA INFO (COLORS, SIZES, ETC...)

function choose(which,what){

    var item = shop.product[which].selectedInfo;

    var itemOf = shop.product[which].selectedInfo.indexOf(what) + what.length;

    var addItem = '';

    var end = '';

    if (what != ''){

        if (shop.product[which].selectedInfo.indexOf(what) != -1){

            var quantity = '';

            var quant = '';

            for (var q=itemOf; q<item.length; q++){

                if (item.charAt(q) != '<' && end == ''){

                    quantity += item.charAt(q);

                    if (item.charAt(q+1) == '<'){

                        quant = parseFloat(quantity)+1;

                    }

                }

                else {

                    end += item.charAt(q);

                }

            }

            for (var r=0; r<item.length; r++){

                if (r < itemOf){

                    addItem += item.charAt(r);

                }

                else {

                    addItem += quant;

                    shop.product[which].selectedInfo = addItem + end;

                    break;

                }

            }

        }

        else {

            shop.product[which].selectedInfo += what + '1<';

        }

    }

    buy(which);

}


// --></script>
